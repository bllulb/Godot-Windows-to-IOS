name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: '4.3' # Ersetze das mit deiner exakten Godot-Version (z. B. '4.4' oder '4.5' falls du Betas nutzt)

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        run: |
          # Lädt Godot für macOS herunter
          curl -LO https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
          unzip Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
          mv Godot.app /Applications/Godot.app
          
          # Lädt die Export Templates für iOS herunter und installiert sie
          curl -LO https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          unzip Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          mkdir -p ~/Library/Application\ Support/Godot/templates/${{ env.GODOT_VERSION }}.stable
          mv templates/* ~/Library/Application\ Support/Godot/templates/${{ env.GODOT_VERSION }}.stable/

      - name: Export Xcode Project from Godot
        run: |
          mkdir -p build/ios
          # Exportiert dein Projekt als Xcode-Projekt
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" build/ios/Project.xcodeproj

      - name: Build and Archive with Xcode (Unsigned)
        run: |
          # Kompiliert das Xcode-Projekt ohne Code-Signing-Zertifikat (daher unsigniert)
          cd build/ios
          xcodebuild archive \
            -project Project.xcodeproj \
            -scheme "Project" \
            -configuration Release \
            -archivePath Project.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Create Unsigned IPA
        run: |
          # Packt das kompilierte Ergebnis in eine .ipa Datei um
          mkdir -p Payload
          cp -r build/ios/Project.xcarchive/Products/Applications/*.app Payload/
          zip -r build/Unsigned-App.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-iOS-App
          path: build/Unsigned-App.ipa
