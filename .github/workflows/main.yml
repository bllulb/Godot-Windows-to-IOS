name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GODOT_VERSION: '4.3'

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        run: |
          # 1. Godot für macOS herunterladen und entpacken
          curl -LO https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
          unzip Godot_v${{ env.GODOT_VERSION }}-stable_macos.universal.zip
          mv Godot.app /Applications/Godot.app
          
          # 2. Export Templates herunterladen und entpacken
          curl -LO https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          unzip Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          
          # Templates am korrekten Ort platzieren
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable"
          cp templates/ios.zip "$HOME/Library/Application Support/Godot/export_templates/${{ env.GODOT_VERSION }}.stable/ios.zip"

      - name: Clean Project and Export Xcode Project
        run: |
          # 1. Wir erstellen einen sauberen, temporären Arbeitsordner
          mkdir -p ../clean_project
          
          # 2. Wir kopieren dein gesamtes Projekt rüber, IGNORIEREN aber den blockierten .godot Ordner komplett!
          rsync -av --exclude='.godot/' . ../clean_project/
          
          # 3. Wir wechseln in den sauberen Ordner und erzwingen volle Schreibrechte
          cd ../clean_project
          chmod -R 777 .
          
          # 4. Ordner für den Export erstellen
          mkdir -p build/ios
          
          # 5. Export im sauberen Ordner ausführen
          /Applications/Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" build/ios/Project.xcodeproj
          
          # 6. Das generierte Xcode-Projekt wieder zurück ins Hauptverzeichnis verschieben
          cd $GITHUB_WORKSPACE
          mkdir -p build
          mv ../clean_project/build/ios build/

      - name: Build and Archive with Xcode (Unsigned)
        run: |
          cd build/ios
          xcodebuild archive \
            -project Project.xcodeproj \
            -scheme "Project" \
            -configuration Release \
            -archivePath Project.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Create Unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/Project.xcarchive/Products/Applications/*.app Payload/
          zip -r build/Unsigned-App.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-iOS-App
          path: build/Unsigned-App.ipa
